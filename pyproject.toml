[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-glue"
version = "0.1.0"
description = "A Cypher query composer that joins reusable query fragments with a little care."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pylint>=3.3.8",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.7",
]

[project.optional-dependencies]
jupyter = ["notebook"]

[tool.isort]
profile = 'black'
src_paths = ['src', 'tests']

[tool.pylint.'FORMAT']
max-line-length = 120
